# Issue catalogue for the synthetic data generator.
#
# Each issue fixes the ground-truth category, subcategory, affected service and
# assignment group. The text pieces are used by the template renderer and passed
# to the model renderer as the facts it must convey. Placeholders in braces are
# filled per thread: {service} {site} {device} {colleague} {error} {time} {day} {count} {file} and so on.
#
# details: specific facts a client may or may not mention. When a detail is left
# out of a thread, its question becomes one of the note's expected open questions.

- id: password-locked
  category: Access and Identity
  subcategory: Account locked
  service: accounts
  group: service-desk
  short_description: User account locked out after password attempts
  scopes: [single]
  problems:
    - "I've locked myself out of my account"
    - "My login says my account is locked"
    - "I can't log in, it keeps saying the account is locked out"
  details:
    - key: error
      text: "The message says \"{error}\""
      question: What is the exact error message?
    - key: since
      text: "It started at about {time}"
      question: When did the lockout start?
    - key: device
      text: "I'm on my laptop {device}"
      question: Which device is being used?
  tried:
    - "I've tried the self-service password reset but it says I'm not registered"
    - "I waited half an hour in case it unlocked itself"
    - "I restarted the laptop"
  asks:
    - "Please can you unlock it"
    - "Can someone reset my password for me"

- id: mfa-new-phone
  category: Access and Identity
  subcategory: Multi-factor authentication
  service: mfa
  group: identity
  short_description: MFA prompts not reaching user's new phone
  scopes: [single]
  problems:
    - "I've got a new phone and now the Authenticator app isn't getting the sign-in prompts"
    - "My MFA has stopped working since I changed my mobile"
    - "I can't approve sign-ins because my old phone is wiped"
  details:
    - key: phone
      text: "The new phone is an {device}"
      question: What make and model is the new phone?
    - key: old_phone
      text: "I've still got the old phone but it's been reset"
      question: Does the user still have the old phone?
    - key: since
      text: "This has been going on since {day}"
      question: When did the prompts stop arriving?
  tried:
    - "I've reinstalled the Authenticator app"
    - "I tried adding the account again but it asks me to approve on the old phone"
  asks:
    - "Can you reset my MFA so I can set it up again"
    - "Please re-register my new phone"

- id: new-starter
  category: Access and Identity
  subcategory: New starter
  service: accounts
  group: service-desk
  short_description: New starter account and laptop request
  scopes: [single]
  problems:
    - "We have a new starter, {colleague}, joining us"
    - "Please can you set up a new user, {colleague}"
    - "Just a heads up that {colleague} starts with us soon and needs everything setting up"
  details:
    - key: start_date
      text: "They start on {start_date}"
      question: What is the new starter's start date?
    - key: role
      text: "They're joining as a {role}"
      question: What is the new starter's job title and team?
    - key: access
      text: "They'll need the same access as {colleague_two}"
      question: Whose access should the new starter mirror?
    - key: kit
      text: "They'll need a laptop and a headset"
      question: What equipment does the new starter need?
  tried: []
  asks:
    - "Can you create the account and get a laptop ready"
    - "Please set them up with email, Teams and {service}"

- id: leaver
