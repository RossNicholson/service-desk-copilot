    - "I can't see the {mailbox} shared mailbox in Outlook any more"
    - "I need access to the {mailbox} mailbox"
    - "The {mailbox} inbox has disappeared from my Outlook"
  details:
    - key: approver
      text: "{colleague} has approved this"
      question: Who has approved the mailbox access?
    - key: level
      text: "I need to be able to send as the mailbox, not just read it"
      question: Is read access enough or does the user need send-as?
    - key: since
      text: "It was there on {day}"
      question: When was the mailbox last visible?
  tried:
    - "I've restarted Outlook"
    - "I checked Outlook on the web and it's not there either"
  asks:
    - "Can you add me back"
    - "Please give me access"

