[project]
name = "service-desk-copilot"
version = "0.1.0"
description = "An AI assistant that removes ticket admin from MSP service desk engineers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "fastapi==0.135.3",
    "litellm==1.105.1",
    "presidio-analyzer==2.2.364",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "uvicorn==0.39.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
# spaCy's small English model, used by Presidio to spot names. Not on PyPI.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv.build-backend]
# Only the application package is installed; datagen/ and scripts/ run from the
# repository root.
module-name = "copilot"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "compose: needs the docker compose stack running (deselect with -m 'not compose')",
]
addopts = "-m 'not compose'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
