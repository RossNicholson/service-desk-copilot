[project]
name = "service-desk-copilot"
version = "0.1.0"
description = "An AI assistant that removes ticket admin from MSP service desk engineers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm==1.105.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
# The project is run from the repository root rather than installed as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "compose: needs the docker compose stack running (deselect with -m 'not compose')",
]
addopts = "-m 'not compose'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
