name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m datagen.validate
      - run: uv run pytest

  compose:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: docker compose up -d --wait
      - run: uv run python scripts/bootstrap_zammad.py --no-token
      - run: uv run pytest -m compose
      - if: failure()
        run: docker compose logs --tail 200
